[project]
name = "rastai-spike"
version = "0.0.1"
description = "Rastai spike (spec v5 §32): throwaway experiments that de-risk the in-house runtime."
requires-python = "==3.12.*"
dependencies = [
    # Foundation (spec §27): GPU math, autograd, kernels.
    "torch>=2.11",
    # Compatibility surface (spec §27): exact token IDs for every model.
    "tokenizers>=0.22",
]

[dependency-groups]
# Reference only: used to check our runtime against Hugging Face, never imported by rastai_spike itself.
reference = [
    "transformers>=4.57",
    "huggingface_hub>=0.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rastai_spike"]

[tool.uv]
default-groups = ["reference"]
