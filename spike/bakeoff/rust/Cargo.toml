[package]
name = "bakeoff-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
bytes = "1"
crc-fast = "1.10.0"
futures-util = "0.3"
memmap2 = "0.9.11"
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
tokio = { version = "1.53", features = ["full"] }
