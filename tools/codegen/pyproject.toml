# Not a package: the settings for the Python codegen tools in this folder (layout rust-node-gateway-proto.md 3.4).
# ruff uses the same rules as python/ (owner decision 7); the tools have no .py ending, so they're named here.
# pytest runs tests/ with the same options as python/. The Rust crate rastai-codegen joins this folder in M1-12.

[tool.ruff]
extend = "../../python/pyproject.toml"
extend-include = ["rewrite_python_imports"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
