[package]
name = "rastai-codegen"
description = "Rastai's dev-only code generators: the error and term catalog, and the document and command types, in every language"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

# Dev tooling only, never shipped (layout: rust-control-plane.md section 4.9). Its outputs are checked in, and
# `just codegen-check` fails when a fresh run would change them.
[[bin]]
name = "rastai-catalog-codegen"
path = "src/bin/rastai_catalog_codegen.rs"

[[bin]]
name = "rastai-formats-codegen"
path = "src/bin/rastai_formats_codegen.rs"

# schemas/names.json, the names the code really has (contracts 12.6). It runs `cargo metadata` as a process for the
# crate names, so it needs no crate for that.
[[bin]]
name = "rastai-names-codegen"
path = "src/bin/rastai_names_codegen.rs"

[dependencies]
# The strict JSON reader: a key written twice in a catalog entry is an error, never a silent overwrite. Also the type
# descriptions, their JSON Schema, the document table, the pretty writer and content hashes the formats outputs use.
rastai-formats = { path = "../../crates/rastai-formats" }
# Severity, so the generator and the tables it writes name the same three levels.
rastai-diag = { path = "../../crates/rastai-diag" }
# The command naming rules: the typed wrappers in commands.js are named by `javascript_wrapper_name`, the one
# implementation of that rule (layout rust-control-plane.md 10.3). The command rows come from its `COMMANDS`.
rastai-core = { path = "../../crates/rastai-core" }
# A command row's kind and stability are the generated enums; command_source.rs writes them as contract words.
rastai-proto = { path = "../../crates/rastai-proto" }
serde_json = { workspace = true }

[lints]
workspace = true
