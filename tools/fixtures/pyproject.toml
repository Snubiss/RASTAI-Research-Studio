# Not a package: the settings for the fixture generators in this folder (contracts 15.8).
# ruff uses the same rules as python/ (owner decision 7). pytest runs tests/ with the same options as python/, plus
# this folder on the import path, so a test can import the generator it checks.

[tool.ruff]
extend = "../../python/pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--import-mode=importlib"]
