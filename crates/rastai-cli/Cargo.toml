[package]
name = "rastai-cli"
description = "The rastai binary: process modes, the in-house argument parser, verbs generated from the command registry"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

# M1-31 lands the modes, the parser, the generated verbs, following jobs, --json and the exit codes (layout:
# rust-control-plane.md section 9, build-order step 1). `storage rebuild-index` (M1-33) brings rastai-store;
# `node serve` and `node init` (M9) bring rastai-node.
[[bin]]
name = "rastai"
path = "src/main.rs"

[dependencies]
rastai-diag = { path = "../rastai-diag" }
# The command naming rules, the registry type, paths, versions, random bytes and the Diagnostic wire conversion.
rastai-core = { path = "../rastai-core" }
# `rastai validate`: the four-layer document read (local_commands.rs).
rastai-formats = { path = "../rastai-formats" }
# The CommandService and EventService messages the CLI sends and reads.
rastai-proto = { path = "../rastai-proto" }
# The binary Connect bodies: Execute, ListCommands and the Subscribe stream (daemon_client.rs, follow.rs).
prost = { workspace = true }
# `rastai serve`: the daemon itself.
rastai-server = { path = "../rastai-server" }
# `rastai mcp`: the stdio bridge.
rastai-mcp = { path = "../rastai-mcp" }
# HTTP/1.1 over daemon.sock (daemon_client.rs).
rastai-transport = { path = "../rastai-transport" }
# The runtime for the modes that talk to a daemon or are one, built in main.rs only for those modes.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "sync", "io-util", "io-std"] }
# Argument JSON, results, the command cache and --json output.
serde_json = { workspace = true }

[dev-dependencies]
# The fake daemon of tests/exit_codes.rs: a Unix socket served on its own runtime.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }

[lints]
workspace = true
