# The cargo-fuzz crate for rastai-server (contracts 12.5, ADR-0037): one target per in-house parser of untrusted
# input. Every request head and body on the daemon's port comes from whatever process or web page reached it, so the
# header reading in front of the request gate has one (`request_gate`), and so do the hand-written Connect JSON
# decoders and the argument check every Execute body reaches (`connect_json`). It is its own workspace (the root Cargo.toml excludes this folder) because it builds
# only on the nightly toolchain `just fuzz` pins. Run a target with: just fuzz rastai-server connect_json 60
[package]
name = "rastai-server-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
# Pinned exactly, like every external crate (root Cargo.toml); a dev dependency of the fuzz crates only.
libfuzzer-sys = "=0.4.13"

[dependencies.rastai-server]
path = ".."

# For `hash_bytes`: the target plants a session and an owner token whose hashes the gate compares against.
[dependencies.rastai-formats]
path = "../../rastai-formats"

# For `Diagnostic`: connect_json checks the code of every refusal.
[dependencies.rastai-diag]
path = "../../rastai-diag"

# For `Scope`: request_gate plants a scoped token beside the owner token.
[dependencies.rastai-core]
path = "../../rastai-core"

# For `CommandDescriptor`: connect_json runs `check_arguments` on every `arguments_json` it decodes.
[dependencies.rastai-proto]
path = "../../rastai-proto"

# An independent workspace for the fuzz targets.
[workspace]
members = ["."]

[[bin]]
name = "request_gate"
path = "fuzz_targets/request_gate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "connect_json"
path = "fuzz_targets/connect_json.rs"
test = false
doc = false
bench = false
