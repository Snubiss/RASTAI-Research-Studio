[package]
name = "rastai-server"
description = "The Rastai daemon: startup, the HTTP listeners, the request gate and sign-in, and later the command layer"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

# The composition root (layout: rust-control-plane.md section 8). M1-26 lands the startup sequence, the listeners,
# the request gate, login codes and origin-bound sessions, /api/health and the Connect JSON of the CommandService
# messages. The Connect envelopes and the Execute path (M1-27, with prost), the bus (M1-28) and the node links (M1-47)
# bring tonic and keyring with them.
[dependencies]
rastai-diag = { path = "../rastai-diag" }
# Paths, settings resolution, principals, versions, random bytes and the clock.
rastai-core = { path = "../rastai-core" }
# hash_bytes, the one BLAKE3 wrapper: login codes, session ids, session keys and the owner token are kept as hashes.
# The strict JSON reader, which the Connect JSON decoder reads every body with.
rastai-formats = { path = "../rastai-formats" }
# The CommandService and Diagnostic messages the Connect JSON codec reads and writes (http/connect_json.rs).
rastai-proto = { path = "../rastai-proto" }
# The daemon lock and rastai.db.
rastai-store = { path = "../rastai-store" }
# daemon.sock: bind, accept with the peer's user, and the same-user check.
rastai-transport = { path = "../rastai-transport" }
# HTTP/1.1 serving on loopback TCP and daemon.sock. Only files under src/http/ use it (contracts 2.5).
axum = { workspace = true, features = ["tokio", "http1"] }
# "signal" for SIGTERM and SIGINT (shutdown.rs), "sync" for the shutdown channel, "rt" for the serve tasks.
tokio = { workspace = true, features = ["net", "rt", "sync", "signal", "time", "macros"] }
# The login body, the login answer, /api/health and the Connect JSON.
serde_json = { workspace = true }

[dev-dependencies]
# tests/connect_protocol.rs reads the golden .binpb files, to compare the Connect JSON with what protobuf-es writes.
prost = { workspace = true }
# #[tokio::test] on the multi-threaded runtime, the way rastai-cli runs the daemon.
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "sync", "signal", "time", "macros"] }

[lints]
workspace = true
