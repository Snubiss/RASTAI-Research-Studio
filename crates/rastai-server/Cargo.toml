[package]
name = "rastai-server"
description = "The Rastai daemon: startup, the HTTP listeners, the request gate and sign-in, the command layer, the event bus and run-log indexing"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

# The composition root (layout: rust-control-plane.md section 8). M1-26 lands the startup sequence, the listeners,
# the request gate, login codes and origin-bound sessions, /api/health and the Connect JSON of the CommandService
# messages; M1-27 the Connect envelopes and the Execute path, with prost; M1-30 `/mcp`, with rastai-mcp; M1-28 the bus,
# Subscribe and the run tails, with http-body. The node links (M1-47) bring tonic, and secrets (M2) keyring.
[dependencies]
rastai-diag = { path = "../rastai-diag" }
# Paths, settings resolution, principals, versions, random bytes and the clock.
rastai-core = { path = "../rastai-core" }
# hash_bytes, the one BLAKE3 wrapper: login codes, session ids, session keys and the owner token are kept as hashes.
# The strict JSON reader, which the Connect JSON decoder reads every body with.
rastai-formats = { path = "../rastai-formats" }
# The CommandService and Diagnostic messages the Connect JSON codec reads and writes (http/connect_json.rs), and the
# command arguments and results (commands/).
rastai-proto = { path = "../rastai-proto" }
# The binary Connect bodies of CommandService (application/proto) and the error details. Only http/connect.rs uses it
# (layout 8.4).
prost = { workspace = true }
# The MCP server side as plain data: JSON-RPC messages, sessions, the tool list and tool replies (http/mcp_endpoint.rs).
rastai-mcp = { path = "../rastai-mcp" }
# The daemon lock and rastai.db.
rastai-store = { path = "../rastai-store" }
# daemon.sock: bind, accept with the peer's user, and the same-user check.
rastai-transport = { path = "../rastai-transport" }
# The frame type of Subscribe's streamed body, which axum's body trait returns but doesn't re-export. Only
# http/connect.rs uses it (contracts 2.5).
http-body = { workspace = true }
# HTTP/1.1 serving on loopback TCP and daemon.sock. Only files under src/http/ use it (contracts 2.5).
axum = { workspace = true, features = ["tokio", "http1"] }
# "signal" for SIGTERM and SIGINT (shutdown.rs), "sync" for the shutdown channel, "rt" for the serve tasks.
tokio = { workspace = true, features = ["net", "rt", "sync", "signal", "time", "macros"] }
# The login body, the login answer, /api/health, the Connect JSON, and command arguments and results.
serde_json = { workspace = true }
# DeserializeOwned, the bound of dispatch.rs's one helper that reads a handler's arguments into its type.
serde = { workspace = true }

[dev-dependencies]
# #[tokio::test] on the multi-threaded runtime, the way rastai-cli runs the daemon; io-util for tests/bus_resume.rs,
# which reads a Subscribe stream envelope by envelope over a plain TCP socket.
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "sync", "signal", "time", "macros", "io-util"] }

[lints]
workspace = true
