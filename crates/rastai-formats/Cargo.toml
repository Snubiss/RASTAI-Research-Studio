[package]
name = "rastai-formats"
description = "Rastai documents: type descriptions, validation, the strict JSON reader, content hashes, semver"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

# rlib only: the WASM and Python builds are their own binding crates (layout: rust-control-plane.md section 4.1).
# It must build for wasm32-unknown-unknown (`just wasm`), so no tokio and nothing that needs an operating system.
# rastai-diag is the one rastai crate it may use (layout 4.10): the validation layers return its Diagnostic.
[dependencies]
rastai-diag = { path = "../rastai-diag" }
serde = { workspace = true }
serde_json = { workspace = true }
# Only src/hashing.rs imports it (contracts 2.5; deny.toml names this crate its one owner).
blake3 = { workspace = true }

[dev-dependencies]
# tests/commands_described.rs checks that every row of rastai-core's COMMANDS has its types here (layout 4.11). Only
# the integration tests use it; the library itself never depends on rastai-core (layout 4.10).
rastai-core = { path = "../rastai-core" }

[lints]
workspace = true
