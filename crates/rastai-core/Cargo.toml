[package]
name = "rastai-core"
description = "Rastai's shared vocabulary that isn't a document: commands, settings, versions, paths, ids, scopes, states"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

# Synchronous and free of I/O except environment variables and /dev/urandom (layout: rust-control-plane.md
# section 5.4). M1-20 landed versions, paths, ids, principals, scopes, states and the wire conversions; M1-21 the
# command registry, naming and settings. rastai-formats joins [dependencies] with the first use of its type
# descriptions (the argument schemas); the table test already reads since_version with its semver parser.
[dependencies]
rastai-diag = { path = "../rastai-diag" }
# The state enums, Diagnostic and CommandDescriptor are rastai-proto's (one owner, contracts 2.4 rule 3). Only
# wire.rs, states.rs, commands/descriptor.rs and commands/registry.rs, which holds descriptors, import it
# (layout 5.3).
rastai-proto = { path = "../rastai-proto" }
# Settings values and layers are JSON (settings.rs, settings_defaults.rs; layout 5.3).
serde_json = { workspace = true }

[dev-dependencies]
# tests/command_table.rs checks that every row's since_version is a semver version.
rastai-formats = { path = "../rastai-formats" }

[lints]
workspace = true
