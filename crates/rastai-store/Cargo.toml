[package]
name = "rastai-store"
description = "Everything the Rastai daemon persists: rastai.db behind one writer thread, read-only reader pools, the daemon lock, the event logs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

# The only crate that touches SQLite, and sqlite.rs is its only file that imports rusqlite (layout: rust-control-plane.md
# section 6.6). M1-23 lands rastai.db, its writer thread, the reader pool and the daemon lock; M1-24 the event-log frames,
# reader and writer; the indexer, blobs and free space (M1-25) and vault.db (M3) bring libc.
[dependencies]
# DataPaths and the path functions (the only place paths are built), and now_unix_ms.
rastai-core = { path = "../rastai-core" }
# crc32.rs, the one CRC-32 table, for frame checksums (contracts 7.1).
rastai-formats = { path = "../rastai-formats" }
# EventRecord, the body of every frame.
rastai-proto = { path = "../rastai-proto" }
# Encodes and decodes EventRecord frame bodies; only src/event_log/frame.rs uses it (layout section 6.5).
prost = { workspace = true }
rusqlite = { workspace = true }
# The list columns (tokens.scopes, nodes.capabilities, plugins.granted_permissions) are JSON arrays of text.
serde_json = { workspace = true }
# Only the oneshot channels a writer thread answers on (layout section 6.5).
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
# tests/index_migrations.rs runs the real migrations and compares PRAGMA table_info with what rastai-codegen's
# sql_names.rs reads from the same .sql files, so the reader behind schemas/names.json can't drift (contracts 12.6,
# layout rust-control-plane.md 2.8). Test-only: rastai-codegen never depends on rastai-store.
rastai-codegen = { path = "../../tools/codegen" }
# tests/writer_thread.rs runs 256 writers at once on a multi-threaded runtime, the way the daemon calls write_index.
tokio = { workspace = true, features = ["sync", "rt-multi-thread"] }

[lints]
workspace = true
