# rastai_formats: rastai-formats for Python (contracts 2.2; layout rust-control-plane.md 4.7 and 4.9): the generated
# dataclasses (rastai_formats/generated/, written by `just codegen`) and the PyO3 module rastai_formats._native, built
# from crates/rastai-formats/bindings/python by maturin. `just wheel` builds the wheel; the cpu environment installs
# this folder editable, which builds the module from source (python/envs/cpu/pyproject.toml).

[project]
name = "rastai-formats"
version = "0.1.0"          # app, node and worker ship together under one version (§20)
requires-python = "==3.12.*"
# None: the generated dataclasses use the standard library only, and the module is built in.
dependencies = []

[build-system]
# maturin is dev tooling (spec §27). Exactly the version the cpu lock holds, so a wheel built by `just wheel` and the
# editable install are made by the same build backend.
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "../../crates/rastai-formats/bindings/python/Cargo.toml"
module-name = "rastai_formats._native"
# Flat layout: the import package is rastai_formats/ next to this file, not under src/ (python/CLAUDE.md).
python-source = "."
# Only the import package goes in the wheel, never tests/.
python-packages = ["rastai_formats"]
# Bytecode a test run left behind isn't source; the wheel is the same whether or not tests ran first.
exclude = ["**/__pycache__/**"]
