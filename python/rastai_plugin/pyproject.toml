# rastai_plugin: the Python plugin SDK (contracts 2.2; layout frontend-and-plugins.md 11). The registry, the
# extension-point base classes, the job-side types, the module loader, the host client and the generated catalog
# (rastai_plugin/catalog/generated.py, written by `just codegen`).

[project]
name = "rastai-plugin"
version = "0.1.0"          # app, node and worker ship together under one version (§20)
requires-python = "==3.12.*"
# The environments (python/envs/) pin the exact grpcio; the workspace packages come from their folders.
dependencies = [
    "rastai-proto",        # the WorkerHostService stub and its messages (host.py only)
    "rastai-formats",      # the manifest, read and validated through the wheel (manifest.py)
    "grpcio>=1.84.0",      # the WorkerHostService client (host.py only; contracts 2.5)
]

[tool.uv.sources]
rastai-proto = { workspace = true }
rastai-formats = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the import package is rastai_plugin/ next to this file, not under src/ (python/CLAUDE.md).
module-root = ""
