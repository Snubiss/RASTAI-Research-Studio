# The cuda13 environment: the default for NVIDIA GPUs with driver 580 or newer (layout python.md section 11; ADR-0009).
# Nothing is resolved on a user's machine: the node installs it from uv.lock with `uv sync --frozen` through
# system.env.install (M2-16). The CUDA runtime packages (nvidia-*, cuda-*) come from PyPI during that install and are
# never bundled in Rastai's own packages (spec §27, the NVIDIA license row).
#
# Direct dependencies are pinned exactly (==), like the cpu environment, so uv.lock and deps/allowlist-python.json
# agree and an update is a deliberate PR. torch and torchvision come from the cu130 index as one build, so
# rastai_data/image_decode.py decodes images with the torchvision that matches torch.

[project]
name = "rastai-env-cuda13"
version = "0.1.0"          # app, node and worker ship together under one version (§20)
requires-python = "==3.12.*"
dependencies = [
    "torch==2.14.1",       # CUDA 13.0 build, from the pinned PyTorch cu130 index below (foundation, §27)
    "tokenizers==0.23.2",  # compatibility surface, same core as the gateway's crate
    "grpcio==1.84.0",      # the worker protocol (protobuf row of §27)
    "protobuf==7.36.2",    # runtime for the generated code
    "torchvision==0.29.1", # image decoding, from the same cu130 index as torch (python layout 11.2; ADR-0037)
    # The CUDA runtime libraries torch needs, pinned directly (NVIDIA proprietary license, spec §27). torch's
    # cuda-toolkit meta package would bring the same packages, but PyPI declares no license for it, so it is
    # left out of the graph (exclude-dependencies below) and these pins name what its extras gave.
    "nvidia-cublas==13.1.1.3",
    "nvidia-cuda-cupti==13.0.85",
    "nvidia-cuda-nvrtc==13.0.88",
    "nvidia-cuda-runtime==13.0.96",
    "nvidia-cufft==12.0.0.61",
    "nvidia-cufile==1.15.1.6",
    "nvidia-curand==10.4.0.35",
    "nvidia-cusolver==12.0.4.66",
    "nvidia-cusparse==12.6.3.3",
    "nvidia-nvjitlink==13.4.92",
    "nvidia-nvtx==13.0.85",
    "rastai-proto",        # the generated protobuf and grpcio code (python/rastai_proto)
    "rastai-formats",      # the generated document and command dataclasses (python/rastai_formats)
    "rastai-models",       # the Inspectable runtime: safetensors I/O so far (python/rastai_models)
    "rastai-data",         # dataset tooling: readers, word vocabulary, splits, loaders (python/rastai_data)
    "rastai-plugin",       # the plugin SDK and the generated catalog (python/rastai_plugin)
    "rastai-train",        # the trainer: loop, optimizer, checkpoints, resume and recipes (python/rastai_train)
    "rastai-worker",       # the job process: WorkerService, the event log, control and exit codes (python/rastai_worker)
]

[dependency-groups]
dev = [
    "pytest==9.1.1",       # test runner (dev tooling, §27); never on a user's machine
    "ruff==0.16.9",        # lint and format (dev tooling, §27)
    "grpcio-tools==1.84.0",  # grpcio's protobuf and gRPC generators, which `just codegen` runs through buf
    "maturin==1.15.0",     # builds rastai-formats' PyO3 module (dev tooling, §27)
]

[tool.uv]
# One uv for every machine, so the lock reads and resolves the same everywhere (the justfile says how to install it).
required-version = "==0.13.0"
# Not a package: this folder only describes an environment, so uv installs its dependencies and nothing else.
package = false
# Supply-chain guard: the same window as the cpu environment (two weeks of releases stay out of the lock).
exclude-newer = "2026-09-27T00:00:00Z"
# torch and torchvision 0.29.1 are the builds the cpu environment and environments.json already use (2026-10-01).
exclude-newer-package = { torch = "2026-10-01T00:00:00Z", torchvision = "2026-10-01T00:00:00Z" }
# cuda-toolkit is a meta package with no code and no license declared on PyPI; the runtime packages it brings are pinned above.
exclude-dependencies = ["cuda-toolkit"]
# rastai-formats builds its PyO3 module with this environment's own maturin (the dev group, locked by hash in uv.lock).
no-build-isolation-package = ["rastai-formats"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true            # only the packages named in [tool.uv.sources] come from this index

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }   # the same index as torch, so the two builds match
# Workspace packages resolve by path in development, editable so a fresh `just codegen` is seen without a resync.
rastai-proto = { path = "../../rastai_proto", editable = true }
rastai-formats = { path = "../../rastai_formats", editable = true }
rastai-models = { path = "../../rastai_models", editable = true }
rastai-data = { path = "../../rastai_data", editable = true }
rastai-plugin = { path = "../../rastai_plugin", editable = true }
rastai-train = { path = "../../rastai_train", editable = true }
rastai-worker = { path = "../../rastai_worker", editable = true }
