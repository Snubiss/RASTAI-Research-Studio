# The cpu environment: the fallback backend, and the one every CI runner and the M1 embedded node use
# (layout: python.md section 11; ADR-0009). Nothing is resolved on a user's machine: the node installs it from
# uv.lock with `uv sync --frozen` (M2-16). Until then `just env-cpu` runs the same sync into .dev/envs/cpu.
#
# Direct dependencies are pinned exactly (==), like the crates in Cargo.toml, so uv.lock and
# deps/allowlist-python.json agree and an update is a deliberate PR. Workspace packages (rastai-proto, rastai-data
# and rastai-plugin so far) have no pin: they come from their folder (tool.uv.sources). The packages the later tasks
# need (pyarrow, torchvision, PyMySQL, onnx, onnxscript and the other workspace packages) join with those tasks.

[project]
name = "rastai-env-cpu"
version = "0.1.0"          # app, node and worker ship together under one version (§20)
requires-python = "==3.12.*"
dependencies = [
    "torch==2.14.1",       # CPU build, from the pinned PyTorch index below (foundation, §27)
    "tokenizers==0.23.2",  # compatibility surface, same core as the gateway's crate
    "grpcio==1.84.0",      # the worker protocol (protobuf row of §27)
    "protobuf==7.36.2",    # runtime for the generated code
    "rastai-proto",        # the generated protobuf and grpcio code (python/rastai_proto)
    "rastai-data",         # dataset tooling: readers, word vocabulary, splits, loaders (python/rastai_data)
    "rastai-plugin",       # the plugin SDK and the generated catalog (python/rastai_plugin)
]

[dependency-groups]
dev = [
    "pytest==9.1.1",       # test runner (dev tooling, §27)
    "ruff==0.16.9",        # lint and format (dev tooling, §27); settings in python/pyproject.toml
    "grpcio-tools==1.84.0",  # grpcio's protobuf and gRPC generators, which `just codegen` runs through buf
]

[tool.uv]
# One uv for every machine, so the lock reads and resolves the same everywhere (the justfile says how to install it).
required-version = "==0.13.0"
# Not a package: this folder only describes an environment, so uv installs its dependencies and nothing else.
package = false
# Supply-chain guard: resolve only files published before this date, so a release from the last two weeks
# (the window in which a compromised upload is usually caught) can't enter the lock. Move it forward
# deliberately when updating the lock.
exclude-newer = "2026-09-27T00:00:00Z"
# The one exception: torch 2.14.1 (published 2026-09-30) is the build the spike measured (ADR-0009, spike 05).
exclude-newer-package = { torch = "2026-10-01T00:00:00Z" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true            # only the packages named in [tool.uv.sources] come from this index

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
# Workspace packages resolve by path in development, editable so a fresh `just codegen` is seen without a resync
# (python layout 11.2); releases install built wheels instead.
rastai-proto = { path = "../../rastai_proto", editable = true }
rastai-data = { path = "../../rastai_data", editable = true }
rastai-plugin = { path = "../../rastai_plugin", editable = true }
