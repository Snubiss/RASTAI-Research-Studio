# cargo-deny policy for the workspace (layout: rust-control-plane.md section 2.4; contracts §2.5).
# `just deny` runs `cargo deny --locked check`: licenses, advisories, sources and bans.
# Which member may use which crate is check-deps' job (Cargo.toml [workspace.metadata.rastai.allowlist], M1-05);
# this file holds what cargo-deny checks well.

[graph]
# Check every feature a member could turn on, so an optional dependency can't sneak past.
all-features = true

[advisories]
# The RustSec database. This is also why sqlx is banned below: RUSTSEC-2023-0071 reaches it through `rsa`.
yanked = "deny"
ignore = []

[licenses]
# ADR-0015 decision 7: permissive licenses only for shipped dependencies. Anything else fails,
# unless it gets a named exception here with a reason.
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
exceptions = []
# The list is the policy, not a picture of today's crates, so a license nobody uses yet is fine.
unused-allowed-license = "allow"

[sources]
# crates.io only; no git dependencies and no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[bans]
multiple-versions = "warn"
# A `*` version is never allowed. A path dependency between our own crates (rastai-formats on rastai-diag) is
# allowed, but cargo-deny only lets it through for crates that can't be published: that is why the root
# Cargo.toml sets `publish = false` in [workspace.package] and every member inherits it.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
  # Banned outright (contracts §2.5 and §12.2).
  { crate = "anyhow", reason = "one hand-written error enum per crate (contracts §12.2)" },
  { crate = "thiserror", reason = "one hand-written error enum per crate (contracts §12.2)" },
  { crate = "reqwest", reason = "not carried over from the spike; HTTP is rastai-transport's job (contracts §2.5)" },
  { crate = "memmap2", reason = "not carried over from the spike; no mmap (layout section 4.12)" },
  { crate = "openssl", reason = "TLS is rustls only (contracts §2.5)" },
  { crate = "openssl-sys", reason = "TLS is rustls only (contracts §2.5)" },
  { crate = "async-trait", reason = "async polymorphism is an enum (contracts §12.2)" },
  { crate = "schemars", reason = "JSON Schema comes from hand-written type descriptions (contracts §5.4)" },
  { crate = "sqlx", reason = "RUSTSEC-2023-0071 through rsa; the MySQL client is mysql_async (contracts §2.5)" },

  # Single-owner crates (contracts §2.5 "Enforced owners"): only the crates in `wrappers` may depend on them
  # directly. libc and miniz_oxide also arrive under third-party crates (libc under tokio and mio, miniz_oxide
  # under flate2); the PR that first brings in such a parent adds it here by name, as Cargo.lock shows it,
  # so a new third-party parent fails CI and gets a look in review.
  { crate = "tokenizers", wrappers = ["rastai-gateway"], reason = "one owner: rastai-gateway (tokenizer.rs)" },
  { crate = "minijinja", wrappers = ["rastai-gateway"], reason = "one owner: rastai-gateway (chat templates)" },
  { crate = "rusqlite", wrappers = ["rastai-store"], reason = "one owner: rastai-store (sqlite.rs)" },
  # cpufeatures (under blake3, M1-14) reads CPU features through libc on ARM Linux and Android.
  { crate = "libc", wrappers = [
    "rastai-store",
    "cpufeatures",
  ], reason = "one owner: rastai-store (disk_space.rs, ADR-0033)" },
  { crate = "pyo3", wrappers = ["rastai-formats-python"], reason = "one owner: the Python binding crate" },
  { crate = "wasm-bindgen", wrappers = ["rastai-formats-wasm"], reason = "one owner: the WASM binding crate" },
  { crate = "keyring", wrappers = ["rastai-server"], reason = "one owner: rastai-server (secrets.rs)" },
  { crate = "blake3", wrappers = ["rastai-formats"], reason = "one owner: rastai-formats (hashing.rs)" },
  { crate = "miniz_oxide", wrappers = ["rastai-formats"], reason = "one owner: rastai-formats (inflate, ADR-0037)" },
  { crate = "ed25519-dalek", wrappers = ["rastai-node"], reason = "one owner: rastai-node (identity.rs)" },
  { crate = "mysql_async", wrappers = ["rastai-archive"], reason = "one owner: rastai-archive (mysql.rs, M11)" },
]
