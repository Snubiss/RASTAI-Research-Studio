# Code generation from proto/ for Rust, Python and JavaScript (contracts §1; layout rust-node-gateway-proto.md 3.4).
# `just codegen` runs `buf generate` with this file; `just codegen-check` (tools/checks/check-generated) runs it
# into a temporary tree and fails if the checked-in output differs. The plugins are pinned in the justfile header.
version: v2

# Each `out` folder holds generated files only, so buf empties it first and a removed .proto leaves nothing behind.
clean: true

plugins:
  # Rust: crates/rastai-proto/src/generated/rastai.<package>.v1.rs, one file per package, which the hand-written
  # lib.rs includes. Checked in, so building never needs buf or protoc (no build.rs).
  # btree_map: protobuf `map` fields become BTreeMap, not HashMap, so a message encodes its map entries in key order
  # every time. The same record then gives the same bytes and the same golden (RunMetrics.values, for example).
  - local: protoc-gen-prost
    out: crates/rastai-proto/src/generated
    opt:
      - flat_output_dir
      - btree_map=.
  # The tonic service code for the same packages; it writes nothing for a package without services.
  # CommandService and EventService are left out: the daemon serves them as Connect over HTTP/1.1 with its own
  # prost encoding (layout rust-control-plane.md 8.4 and 11.3), never through tonic, so their stubs would be unused.
  - local: protoc-gen-tonic
    out: crates/rastai-proto/src/generated
    opt:
      - flat_output_dir
    exclude_types:
      - rastai.commands.v1.CommandService
      - rastai.events.v1.EventService

  # Python: python/rastai_proto/rastai_proto/<package>/v1/*_pb2.py and *_pb2_grpc.py, generated by grpcio-tools
  # in the cpu environment's dev group, with `rastai.` imports rewritten to `rastai_proto.` so they never shadow
  # the rastai SDK. One run over every file, so each package folder gets its __init__.py exactly once.
  - local: [.dev/envs/cpu/bin/python, tools/codegen/rewrite_python_imports]
    out: python/rastai_proto/rastai_proto
    strategy: all

  # JavaScript: packages/proto/src/generated/rastai/<package>/v1/*_pb.js with *_pb.d.ts declarations
  # (protobuf-es v2, target js+dts, ADR-0036). The service descriptors it writes are what connect-es uses.
  - local: node_modules/.bin/protoc-gen-es
    out: packages/proto/src/generated
    opt:
      - target=js+dts
      - import_extension=js
