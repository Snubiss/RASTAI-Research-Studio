# CI, started by hand (contracts 15.9, plan 8.7). The workflow stays thin: each job checks out
# the repository, installs the pinned dev tools (tools/ci/install-dev-tools), restores its caches and runs one `just`
# recipe, so a red job reproduces locally with the same command. The job ids become the required status checks of
# branch protection once CI returns (plan 8.4); tests/workspace/ci-workflows.test.js keeps the two lists equal.
#
# Steps that repeat are written once, where they first appear (`&name`), and reused by reference (`*name`).
# Actions are pinned to a commit, with the release tag beside it, so a moved tag can't change what runs.
name: ci

# Manual runs only (owner decision of 2026-10-11, PROC-01): the private repository's free Actions minutes ran out, so
# the gate is local while the repository is private: the pre-push hook runs `just check`, and the verifier runs it on
# a fresh clone of the PR head (plan 3.6). Start a run from the Actions tab or with `gh workflow run ci.yml --ref
# <branch>`. When CI returns (a public repository or a self-hosted runner), the triggers go back to `pull_request`
# and `push` to main; the jobs below already handle both.
on:
  workflow_dispatch:

# No job writes to the repository.
permissions:
  contents: read

# A pull request's runs share one group, so a new push cancels the run it replaces. Any other run (a push to main, or
# a manual run) gets a group of its own commit, because GitHub keeps only one waiting run per group and drops the
# older one: with one shared group, a merge that landed while another was waiting would never get a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A runner builds everything once, so incremental compilation would only add work and cache size.
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # corepack downloads the pnpm that package.json pins (checked against its sha512) without asking first.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

defaults:
  run:
    # Git Bash on Windows, so the install script and the justfile's bash recipes run the same on every runner.
    shell: bash

jobs:
  # The gate every PR passes (contracts 12.6): format, lint, the JSDoc check, every test, wasm, cargo-deny and the
  # repo checks, check-names and check-schema-diff among them.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # proto-check runs `buf breaking`, and check-schema-diff diffs schemas/commands/ and schemas/events/,
          # against the merge base of HEAD and the base branch, so they need its history, not only the merge commit.
          fetch-depth: 0
      - name: Restore the protoc plugins
        # protoc-gen-prost and protoc-gen-tonic are built with cargo install, which takes minutes. ~/.cargo/bin is
        # not in the cargo cache below. The install script holds their pins, so a new pin is a new key; the script
        # also checks a restored plugin's version and rebuilds it if it differs.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/protoc-gen-prost
            ~/.cargo/bin/protoc-gen-tonic
          key: protoc-plugins-${{ runner.os }}-${{ hashFiles('tools/ci/install-dev-tools') }}
      - name: Install just, uv, Node.js, pnpm, cargo-deny, buf, the protoc plugins and the test browsers
        run: tools/ci/install-dev-tools just uv node cargo-deny buf protoc-gen-prost protoc-gen-tonic browsers
      - &cargo-cache
        name: Restore the cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The downloaded crates and the build output. Each job keeps its own, because clippy, tests and wasm
          # builds leave different things in target/.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - &uv-cache
        name: Restore the uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # uv's download cache (torch alone is about 200 MB): ~/.cache/uv on Linux and macOS, AppData on Windows.
          path: |
            ~/.cache/uv
            ~/AppData/Local/uv/cache
          key: uv-${{ runner.os }}-${{ hashFiles('python/envs/*/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - &pnpm-cache
        name: Restore the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # pnpm's content-addressed store: ~/.local/share/pnpm on Linux, ~/Library/pnpm on macOS.
          path: |
            ~/.local/share/pnpm/store
            ~/Library/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: just check
        run: just check
        env:
          # The branch the pull request merges into; a manual run has none and compares with main.
          RASTAI_BASE_REF: origin/${{ github.base_ref || 'main' }}

  # Every commit of the pull request carries a Signed-off-by matching its author (plan 8.6). In-house, so no
  # GitHub App is needed. A manual run has no pull request, so this job is skipped; locally, `just check-dco` checks
  # the commits not yet on main.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-dco reads each commit of the pull request, so it needs the history, not only the merge commit.
          fetch-depth: 0
      - &install-just-uv
        name: Install just and uv
        run: tools/ci/install-dev-tools just uv
      - *uv-cache
      - name: just check-dco
        env:
          # The pull request's own commits: from the base branch's tip to the branch's head.
          COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: just check-dco "$COMMIT_RANGE"

  # Rust tests on all three OS runners, CPU only: tier 2 keeps compiling and passing (ADR-0014, spec §28 risk 13).
  test-rust-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - &checkout
        name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &install-just
        name: Install just
        run: tools/ci/install-dev-tools just
      - *cargo-cache
      - &test-rust
        name: just test-rust
        run: just test-rust

  test-rust-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - *checkout
      - *install-just
      - *cargo-cache
      - *test-rust

  test-rust-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - *checkout
      - *install-just
      - *cargo-cache
      - *test-rust

  # Every Python test on Linux, posix_only ones included: python/ and the repo checks' tests. The cpu environment
  # builds rastai_formats' PyO3 module with cargo (M1-19), hence the cargo cache in the Python jobs.
  test-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *checkout
      - *install-just-uv
      - *uv-cache
      - *cargo-cache
      - name: just test-python
        run: just test-python

  # The pure-compute packages' CPU tests on macOS and Windows, without the posix_only tests (plan 8.7).
  test-python-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - *checkout
      - *install-just-uv
      - *uv-cache
      - *cargo-cache
      - &test-python-portable
        name: just test-python-portable
        run: just test-python-portable

  test-python-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - *checkout
      - *install-just-uv
      - *uv-cache
      - *cargo-cache
      - *test-python-portable

  # The kill -9 matrix (flows/platform.md 6.5; plan M1-48): real daemon and worker processes killed at named points,
  # restarted and checked, with the real TextCNN worker, so it needs the cpu environment. Linux only: the rows read
  # /proc and signal process groups.
  test-crash:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *checkout
      - *install-just-uv
      - *uv-cache
      - *cargo-cache
      - name: just test-crash
        run: just test-crash

  test-js:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *checkout
      - &install-just-node
        name: Install just, Node.js, pnpm and the test browsers
        run: tools/ci/install-dev-tools just node browsers
      - *pnpm-cache
      - &test-js
        name: just test-js
        run: just test-js

  test-js-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - *checkout
      - *install-just-node
      - *pnpm-cache
      - *test-js

  # The web app in a real daemon, in Chromium and WebKit (plan M1-54): the palette, Basic and Advanced, the themes and
  # axe-core on every section. The daemon serves the built app, so the job builds the web app and the binary first.
  e2e-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *checkout
      - *install-just-node
      - *pnpm-cache
      - *cargo-cache
      - name: just e2e-web
        run: just e2e-web

  # HTTP, the CLI and MCP against one real daemon (plan M1-49): the same commands give the same outcomes on all
  # three, and the MCP sessions match fixtures/mcp/e2e/. Linux only: the daemon's job tests read /proc and signal
  # process groups. It runs the real TextCNN job in the cpu environment, hence the uv and cargo caches.
  e2e-surfaces:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *checkout
      - *install-just-uv
      - *uv-cache
      - *cargo-cache
      - name: just e2e-surfaces
        run: just e2e-surfaces
