# Nightly runs on main, started by hand for now (contracts 15.9, plan 8.7): every fuzz target of contracts 12.5 for
# 10 minutes each (ADR-0037). None of these jobs is a required check. node-over-ssh joins this file with M9-E02.
#
# Like ci.yml, each job installs the pinned dev tools (tools/ci/install-dev-tools) and runs one `just` recipe.
# Actions are pinned to a commit, with the release tag beside it.
name: nightly

# Manual runs only while the repository is private (owner decision of 2026-10-11, PROC-01; see ci.yml). When CI
# returns, the trigger goes back to `schedule` with cron "17 3 * * *": 03:17 UTC every night, not on the full hour,
# when GitHub's queue of scheduled runs is longest. Start a run with `gh workflow run nightly.yml --ref main`.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # Ten minutes per target (plan 8.7).
  FUZZ_SECONDS: "600"

defaults:
  run:
    shell: bash

jobs:
  fuzz:
    # A schedule runs on the default branch already; the guard keeps a manual run on main too, so the corpus
    # cache and any crash belong to main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # The build, ten minutes of fuzzing and some headroom.
    timeout-minutes: 30
    strategy:
      # One target's crash must not stop the others from running their ten minutes.
      fail-fast: false
      matrix:
        # Every cargo-fuzz target that exists so far, by crate and target name (contracts 12.5). A new target joins
        # this list in the PR that adds it; tests/workspace/ci-workflows.test.js fails until it does.
        include:
          - { crate: rastai-formats, target: json_reader }
          - { crate: rastai-formats, target: read_document }
          - { crate: rastai-formats, target: safetensors_header }
          - { crate: rastai-core, target: base32_decode }
          - { crate: rastai-core, target: rfc3339_parse }
          - { crate: rastai-store, target: event_frame }
          - { crate: rastai-mcp, target: jsonrpc_decode }
          - { crate: rastai-server, target: request_gate }
          - { crate: rastai-server, target: connect_json }
    name: fuzz ${{ matrix.crate }} ${{ matrix.target }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install just
        run: tools/ci/install-dev-tools just
      - name: Install the nightly toolchain the justfile pins for fuzzing
        # cargo-fuzz builds with sanitizer flags, which need nightly. The justfile's fuzz_toolchain is the one pin.
        run: rustup toolchain install "$(just --evaluate fuzz_toolchain)" --profile minimal
      - name: Restore the cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Each fuzz crate is its own workspace with its own lock and target/ folder.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/${{ matrix.crate }}/fuzz/target
          key: fuzz-${{ matrix.crate }}-${{ matrix.target }}-${{ hashFiles('crates/*/fuzz/Cargo.lock') }}
          restore-keys: fuzz-${{ matrix.crate }}-${{ matrix.target }}-
      - name: Read the cargo-fuzz pin
        # The justfile's cargo_fuzz_version is the one pin; the next step keys its cache on it.
        id: pins
        run: echo "cargo_fuzz_version=$(just --evaluate cargo_fuzz_version)" >> "$GITHUB_OUTPUT"
      - name: Restore the cargo-fuzz binary
        # ~/.cargo/bin is not in the cargo cache above, so without this every job would rebuild cargo-fuzz every
        # night. A new pin is a new key, so a version bump still builds the new version once.
        id: cargo-fuzz-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ steps.pins.outputs.cargo_fuzz_version }}
      - name: Install cargo-fuzz
        # Built from crates.io, as the justfile header says, so it targets this runner's gnu host; cargo checks the
        # crate against the index's checksum. Only on a cache miss: a restored binary is already this exact version.
        if: steps.cargo-fuzz-cache.outputs.cache-hit != 'true'
        run: cargo install --locked "cargo-fuzz@${{ steps.pins.outputs.cargo_fuzz_version }}"
      - name: Restore the fuzz corpus
        # cargo-fuzz keeps the inputs that reached new code in fuzz/corpus/<target>/ (git-ignored). A cache entry can't
        # be overwritten, so each night saves under a new key (its run id) and the next night restores the newest one
        # through restore-keys. That way each night starts from what the earlier nights found, not from nothing.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/${{ matrix.crate }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.crate }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.crate }}-${{ matrix.target }}-
      - name: just fuzz
        run: just fuzz "${{ matrix.crate }}" "${{ matrix.target }}" "$FUZZ_SECONDS"
      - name: Keep the crashing inputs
        # cargo-fuzz writes each crashing input to fuzz/artifacts/<target>/; this keeps them for reproducing.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes-${{ matrix.crate }}-${{ matrix.target }}
          path: crates/${{ matrix.crate }}/fuzz/artifacts/
